<html>
    <head>

        <title>Record Clicker</title>

        <style>
            body{
                background-color: #dedede;
                display: flex;
                align-items: center;
                flex-direction: column;
                
            }
            @-webkit-keyframes rotating {
                from{
                    -webkit-transfor: rotate(0deg);
                    -o-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                to{
                    -webkit-transfor: rotate(360deg);
                    -o-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
            @keyframes rotating{
                from{
                    -ms-transform: rotate(0deg);
                    -moz-transform: rotate(0deg);
                    -webkit-transform: rotate(0deg);
                    -o-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                to{
                    -ms-transform: rotate(360deg);
                    -moz-transform: rotate(360deg);
                    -webkit-transform: rotate(360deg);
                    -o-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
            .rotating{
                -webkit-animation: 4s linear infinite;
                -moz-animation: 4s linear infinite;
                -ms-animation: 4s linear infinite;
                -o-animation: 4s linear infinite;
                animation: rotating 4s linear infinite;
            }
            #recordDiv{
                background-color: #dedede;
                width: 500px;
                height: 500px;
                margin: 100px 100px 100px 100px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #controlBar{
                background-color: pink;
                width: 900px;
                height: 100px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: row;
                
            }
            #playButton{
                background-color: greenyellow;
                width: 75px;
                height: 75px;
                
            }
            #clicks{
                background-color: lightblue;
                width: 175px;
                height: 100px;
                margin-bottom: 10px;
            }
            #rpm{
                background-color: lightcoral;
                width: 175px;
                height: 100px;
                margin-bottom: 10px;
            }
            #powerups{
                background-color: lightgreen;
                width: 175px;
                height: 300px;
            }
            .mother{
                background-color: peru;
                width: 175px;
                height: 520px;
                padding: 15px;
                text-align: center;
            }
            .grandmother{
                background-color: #dedede;
                display: flex;
                align-content: space-around;
                height: 700px;
                width: 900px;
            }
        </style>

    </head>
    <body>
        <div class="grandmother">

            <div class="rotating" id="recordDiv">
                <img id="albumImage" src="" height="500px" weight="500px">
            </div>

            <div class="mother">
                <div id="clicks">Number of clicks:</div>
                <div id="rpm">Spin Rate:</div>
                <div id="powerups">Powerups:</div>
            </div> 
        </div>

        <div id="controlBar">
            <div id="playButton">
                <img src="https://cdn-icons-png.flaticon.com/512/84/84353.png" height="75px" width="75px">
            </div>
        </div>


        <script>
            playButtonObject = document.querySelector('#playButton');
            albumButtonObject = document.querySelector('#recordDiv');

            image = document.getElementById("albumImage")

        
            const playlist = [
                {
                    title: "Song One",
                    artist: "Artist One",
                    year: 2021,
                    audioSrc: "rick_roll.mp3",
                    imageSrc: "rick_roll.png"
                },
                {
                    title: "Song Two",
                    artist: "Artist Two",
                    year: 2022,
                    audioSrc: "heartbreak_anniversary.mp3",
                    imageSrc: "heartbreak_anniversary.png"
                },
                {
                    title: "Song Three",
                    artist: "Artist Three",
                    year: 2023,
                    audioSrc: "unethical.mp3",
                    imageSrc: "unethical.png"
                }
            ];

            image.src = playlist[1]["imageSrc"]

            let currentIndex = 1;
            let currentAudio = new Audio();

            function nextSong() {
                currentIndex = (currentIndex + 1) % playlist.length;
                const song = playlist[currentIndex];

                currentAudio.pause();
                currentAudio.src = song.audioSrc;
                currentAudio.play();

                //albumButtonObject.style.backgroundImage = song.imageSrc
                //albumButtonObject.style.backgroundSize = "cover";
                //albumButtonObject.style.backgroundPosition = "center";
            }
            

            playButtonObject.addEventListener('click', () => {
                // Put play button info here! Replace the background magenta thing![cite: 1]
                nextSong();
            });
            
            //formats not good, but js in case we didn't add it yet

            let score = 0;
            const counter = document.getElementById('clicks');

            albumButtonObject.addEventListener('click', () => {
                // document.body.style.backgroundColor = "yellow";
                
                score++;
                counter.textContent = `Number of Clicks: ${score}`;

                albumButtonObject.style.width = '450px';
                albumButtonObject.style.height = '450px';
                albumButtonObject.style.margin = '125px';

                image.style.width = '450px'
                image.style.height = '450px'
                image.style.margin = '0px';

                setTimeout(() => {
                    albumButtonObject.style.width = '500px';
                    albumButtonObject.style.height = '500px';
                    albumButtonObject.style.margin = '100px';

                    image.style.width = '500px'
                    image.style.height = '500px'
                    image.style.margin = '0px';
                },100)

                
            });

            //the extra thingy
            // setInterval(() => {
            //     if(score > 0){
            //     score = score * 1.1;
            //     score = Math.round(score);
            //     counter.textContent = `Number of Clicks: ${score}`;
            //     }
            // }, 120000);
        </script>
    </body>
</html>
