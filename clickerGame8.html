<html>
    <head>

        <title>Record Clicker</title>

        <style>
            body{
                background-color: #F9E7E7;
                display: flex;
                align-items: center;
                flex-direction: column;
                
            }
            @-webkit-keyframes rotating {
                from{
                    -webkit-transfor: rotate(0deg);
                    -o-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                to{
                    -webkit-transfor: rotate(360deg);
                    -o-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
            @keyframes rotating{
                from{
                    -ms-transform: rotate(0deg);
                    -moz-transform: rotate(0deg);
                    -webkit-transform: rotate(0deg);
                    -o-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                to{
                    -ms-transform: rotate(360deg);
                    -moz-transform: rotate(360deg);
                    -webkit-transform: rotate(360deg);
                    -o-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
            .rotating{
                -webkit-animation: 4s linear infinite;
                -moz-animation: 4s linear infinite;
                -ms-animation: 4s linear infinite;
                -o-animation: 4s linear infinite;
                animation: rotating 4s linear infinite;
            }
            #recordDiv{
                background-color: #F9E7E7;
                width: 500px;
                height: 500px;
                margin: 100px 100px 100px 100px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #controlBar{
                background-color: #95B46A;
                width: 900px;
                height: 100px;
                display: flex;
                align-items: center;
                justify-content: space-around;
                flex-direction: row;
                
            }
            #playButton{
                /*background-color: #172815;*/
                width: 75px;
                height: 75px;
                
            }
            #clicks{
                background-color: #95B46A;
                width: 175px;
                height: 100px;
                margin-bottom: 10px;
            }
            #rpm{
                background-color: #95B46A;
                width: 175px;
                height: 45px;
                margin-bottom: 10px;
            }
            #pointValue{
                background-color: #95B46A;
                width: 175px;
                height: 45px;
                margin-bottom: 10px;
            }
            #powerups{
                background-color: #95B46A;
                width: 175px;
                height: 300px;
            }
            .mother{
                background-color: #3E5622;
                width: 175px;
                height: 520px;
                padding: 15px;
                text-align: center;
            }
            .grandmother{
                background-color: #F9E7E7;
                display: flex;
                align-content: space-around;
                height: 700px;
                width: 900px;
            }
            #rpmButton{
                margin-bottom: 10px;
            }
            #doubleClick{
                margin-bottom: 10px;
            }
            #invis{
                color: #95B46A;
            }
            #titleBar{
                background-color: #95B46A;
                height: 50px;
                width: 900px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: xx-large;
                border: 2px;
                border-color: #3E5622;
            }
        </style>

    </head>
    <body>
        <div id="titleBar">
            Album Clicker Game
        </div>

        <div class="grandmother">

            <div class="rotating" id="recordDiv">
                <img id="albumImage" src="" height="500px" weight="500px">
            </div>

            <div class="mother">
                <div id="clicks">
                    Number of clicks: 0
                </div>
                <div id="rpm">
                    Spin Rate:
                </div>
                <div id="pointValue">
                    Point Value: 1
                </div>
                <div id="powerups">
                    Powerups:
                    <button id="rpmButton">75 clicks for x1.25 speed</button>
                    <button id="doubleClick">150 for double clicks</button>
                    <button id="next">300 clicks for next song</button>
                </div>
            </div> 
        </div>

        <div id="controlBar">
            <div id="invis">
                Every minute, points boost x1.25
            </div>
            <div id="playButton">
                <img src="https://cdn-icons-png.flaticon.com/512/84/84353.png" height="75px" width="75px">
            </div>
            <div>
                Every minute, points boost x1.25
            </div>
        </div>


        <script>
            let rpm = 4;
            rpmDiv = document.getElementById('rpm')
            rpmDiv.textContent = `Rps: ${rpm}`;
            playButtonObject = document.querySelector('#playButton');
            albumButtonObject = document.querySelector('#recordDiv');

            image = document.getElementById("albumImage")

            rpmButtonObject = document.querySelector('#rpmButton')

            doubleButtonObject = document.getElementById("doubleClick")

            nextButtonObject = document.getElementById("next")

            

        
            const playlist = [
                {
                    title: "Song One",
                    artist: "Artist One",
                    year: 2021,
                    audioSrc: "rick_roll.mp3",
                    imageSrc: "rick_roll.png"
                },
                {
                    title: "Song Two",
                    artist: "Artist Two",
                    year: 2022,
                    audioSrc: "heartbreak_anniversary.mp3",
                    imageSrc: "heartbreak_anniversary.png"
                },
                {
                    title: "Song Three",
                    artist: "Artist Three",
                    year: 2023,
                    audioSrc: "unethical.mp3",
                    imageSrc: "unethical.png"
                }
            ];

            image.src = playlist[0]["imageSrc"]

            let currentIndex = 0;
            let currentAudio = new Audio();

            function nextSong() {
                currentIndex = (currentIndex + 1) % playlist.length;
                let song = playlist[currentIndex];

                currentAudio.pause();
                currentAudio.src = song.audioSrc;
                currentAudio.play();

                image.src = playlist[currentIndex]["imageSrc"]
                //albumButtonObject.style.backgroundImage = song.imageSrc
                //albumButtonObject.style.backgroundSize = "cover";
                //albumButtonObject.style.backgroundPosition = "center";
            }

            function pauseMusic(){
                //currentIndex = (currentIndex + 1) % playlist.length;
                let song = playlist[currentIndex];
                currentAudio.src = song.audioSrc;
                currentAudio.pause();
            }

            function playMusic(){
                //currentIndex = (currentIndex + 1) % playlist.length;
                let song = playlist[currentIndex];
                currentAudio.src = song.audioSrc;
                currentAudio.play();
            }
            
            let clickNum = 0;
            playButtonObject.addEventListener('click', () => {
                // Put play button info here! Replace the background magenta thing![cite: 1]
                // nextSong();
                // rpm = 4;
                // rpmDiv = document.getElementById('rpm')
                // rpmDiv.textContent = `Rps: ${rpm}`;
                
                
                if(clickNum % 2 == 1)
                    pauseMusic();
                else
                    playMusic();
                clickNum++;
            });
            
            //formats not good, but js in case we didn't add it yet

            
            let score = 0;
            let points = 1;
            const counter = document.getElementById('clicks');
            const pointUpdate = document.getElementById("pointValue")
            
            //every minute, get a bit of point boost
            setTimeout(() => {
                points *= 1.25;
                pointUpdate.textContent = `Point Value: ${points}`;
            },60000)

            rpmButtonObject.addEventListener('click', ()=> {
                if(score>=75)
                {
                    score -= 75;
                    counter.textContent = `Number of Clicks: ${score}`;
                    rpm *= 0.75;
                    document.querySelector('.rotating').style.animation = `rotating ${rpm}s linear infinite`;
                    counter.textContent = `Number of Clicks: ${score}`;
                    rpmDiv.textContent = `Rps: ${rpm}`;
                }
            })

            doubleButtonObject.addEventListener('click', ()=> {
                if(score>=150)
                {
                    score -= 150;
                    counter.textContent = `Number of Clicks: ${score}`;
                    points *= 2;
                    pointUpdate.textContent = `Point Value: ${points}`;
                }
            })



            nextButtonObject.addEventListener('click', ()=> {
                if(score>=300)
                {
                    score -= 300;
                    counter.textContent = `Number of Clicks: ${score}`;
                    nextSong();
                    rpm = 4;
                    rpmDiv = document.getElementById('rpm')
                    rpmDiv.textContent = `Rps: ${rpm}`;
                    points = 1;
                    pointUpdate.textContent = `Point Value: ${points}`;
                }
            })



            albumButtonObject.addEventListener('click', () => {
                // document.body.style.backgroundColor = "yellow";
                
                score += points;
                counter.textContent = `Number of Clicks: ${score}`;

                albumButtonObject.style.width = '450px';
                albumButtonObject.style.height = '450px';
                albumButtonObject.style.margin = '125px';

                image.style.width = '450px'
                image.style.height = '450px'
                image.style.margin = '0px';

                setTimeout(() => {
                    albumButtonObject.style.width = '500px';
                    albumButtonObject.style.height = '500px';
                    albumButtonObject.style.margin = '100px';

                    image.style.width = '500px'
                    image.style.height = '500px'
                    image.style.margin = '0px';
                },100)

                
            });

        </script>
    </body>
</html>
